# /etc/nginx/sites-available/cammodoro  (symlink into sites-enabled)
# Certbot will add the HTTPS (443) block and the redirect for you.
server {
    listen 80;
    listen [::]:80;
    server_name cammodoro.camenos.com;

    root /var/www/cammodoro;
    index index.html;

    # never serve repo internals
    location ~ /\.(?!well-known) { deny all; }
    location /deploy/            { deny all; }
    location = /README.md        { deny all; }

    # always revalidate the shell so updates reach phones quickly
    location = /sw.js         { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /index.html    { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }

    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options nosniff;
    }

    gzip on;
    gzip_types text/css application/javascript application/manifest+json image/svg+xml;
}
